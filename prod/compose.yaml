# The local development stack. Run from prod/: `make up` or `docker compose up -d`.
# See docs/development_setup.md §3.

name: threeden # containers and the data volume are named threeden-…, not after the folder

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: threeden
      POSTGRES_USER: threeden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # only this Mac can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threeden -d threeden"]
      interval: 2s
      retries: 30

  api:
    build: ./server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      # Trust Caddy's X-Forwarded-For, so the API sees each visitor's address
      # (for rate limits). Safe because only Caddy can reach the API.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./server:/srv/server # edit on the Mac, reload in the container
      - ./shared:/srv/shared:ro
    depends_on:
      db: { condition: service_healthy }

  web:
    image: caddy:2
    ports:
      - "8080:8080" # open to your Wi-Fi so your iPhone can reach it
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
    depends_on: [api]

  # ESLint and TypeScript for web/ (make check-web). Not started by `make up`.
  webcheck:
    image: node:24-slim
    profiles: [tools]
    working_dir: /srv/web
    # Installs packages only when package-lock.json has changed since last time.
    command: >-
      sh -c "cmp -s package-lock.json node_modules/.installed-from-lock ||
      (npm ci --no-audit --no-fund --loglevel=error --update-notifier=false &&
      cp package-lock.json node_modules/.installed-from-lock) &&
      npm run --silent check"
    volumes:
      - ./web:/srv/web
      - webnode:/srv/web/node_modules # packages stay in Docker, not in the repo folder

  # Browser checks against the running stack (make e2e). Not started by `make up`.
  e2e:
    build: ./e2e
    profiles: [tools]
    command: python3 web_auth.py
    volumes:
      - ./e2e:/srv/e2e:ro
    depends_on: [web]

volumes:
  pgdata:
  webnode:
