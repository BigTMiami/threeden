<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3den: Hello World</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    body {
      margin: 0;
      background: var(--color-page);
      color: var(--color-text);
      font: var(--font-size-body) / var(--line-height) var(--font-sans);
    }
    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-family: var(--font-wordmark);
      font-weight: normal;
      font-size: 28px;
      margin: 0 0 4px;
    }
    h2 {
      font-family: var(--font-serif);
      font-weight: normal;
      font-size: 20px;
      border-bottom: 1px solid var(--color-border);
      margin: 28px 0 10px;
    }
    .muted { color: var(--color-text-muted); }
    .status { display: flex; gap: 20px; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--color-border-strong); }
    .dot.ok { background: #14866d; }
    .dot.bad { background: var(--color-danger); }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }
    #greetings { list-style: none; margin: 0; padding: 0; }
    #greetings li { padding: 8px 12px; border-top: 1px solid var(--color-border-faint); overflow-wrap: anywhere; }
    #greetings li:first-child { border-top: 0; }
    #greetings time { display: block; font-size: var(--font-size-small); color: var(--color-text-faint); }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 6px 8px;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius);
    }
    button {
      font: inherit;
      padding: 6px 14px;
      color: var(--color-on-accent);
      background: var(--color-accent);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius);
      cursor: pointer;
    }
    button:hover { background: var(--color-accent-hover); }
    button:disabled { opacity: 0.6; cursor: default; }
    .hint { font-size: var(--font-size-small); margin-top: 6px; }
    .error { color: var(--color-danger); }
  </style>
</head>
<body>
  <main>
    <h1>3den</h1>
    <p class="muted">Hello World: this page reads and writes greetings through FastAPI and Postgres.</p>

    <h2>Status</h2>
    <ul class="status">
      <li><span class="dot" id="server-dot"></span>Server: <span id="server-status">checking…</span></li>
      <li><span class="dot" id="db-dot"></span>Database: <span id="db-status">checking…</span></li>
    </ul>

    <h2>Greetings <span class="muted" id="count"></span></h2>
    <div class="card">
      <ul id="greetings"><li class="muted">Loading…</li></ul>
    </div>

    <h2>Add one</h2>
    <form id="add-form">
      <input type="text" id="message" name="message" maxlength="200" required
             placeholder="Say hello" autocomplete="off" aria-label="Greeting">
      <button type="submit">Add</button>
    </form>
    <p class="hint muted"><span id="chars">0</span>/200 · <a href="/api/docs">API docs</a></p>
    <p class="hint error" id="form-error" hidden></p>
  </main>

  <script type="module" src="hello.js"></script>
</body>
</html>
